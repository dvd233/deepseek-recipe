name: DeepSeek demo native fixed validation
on:
  push:
    branches: [repro/demo-custom-tool-fixed-20261006]
permissions:
  contents: read
concurrency:
  group: deepseek-demo-fixed-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-fixed:
    if: >-
      github.repository == 'dvd233/deepseek-recipe' &&
      github.repository_owner_id == '111864431' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/repro/demo-custom-tool-fixed-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out exact reviewed proposal commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: proposal
          persist-credentials: false
      - name: Verify proposal identity and reviewed payload hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = dvd233/deepseek-recipe
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/repro/demo-custom-tool-fixed-20261006
          test "$(git -C proposal rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C proposal cat-file -p HEAD | awk '/^parent / { print $2 }')" = 76aab440ed30830d5e060ed70e62c75c208d8583
          printf '%s  %s\n' \
            '7c2017110cc500536bfa66bfff3eb1b7c49865d6a18e6972213126846a77da3e' 'proposal/repro/demo-custom-tool-fixed/decode_custom_tool_regression.rs' \
            'c6ceff98d4cdce70c38c0b6ad704183bc789cf069c2bfc778a3d8ccce34b2b3f' 'proposal/repro/demo-custom-tool-fixed/run-fixed.sh' \
            '8dc5631dedfeff6130b3aea7de2fb6385ca0fbd073814266b5d0f2702ddb546e' 'proposal/repro/demo-custom-tool-fixed/main.rs' \
            | sha256sum --check --strict
      - name: Check out immutable original upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: upstream
          persist-credentials: false
      - name: Install repository-pinned minimal official Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Verify fixed native handler, clippy, and format
        run: bash "$GITHUB_WORKSPACE/proposal/repro/demo-custom-tool-fixed/run-fixed.sh" "$GITHUB_WORKSPACE/upstream" "$GITHUB_WORKSPACE/proposal/repro/demo-custom-tool-fixed"
      - name: Keep exact verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deepseek-demo-native-fixed
          path: upstream/evidence/
          if-no-files-found: error
          retention-days: 7
